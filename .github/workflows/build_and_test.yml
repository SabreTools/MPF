name: Build and Test

on:
    push:
        branches: ["master"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Free Disk Space (Ubuntu)
              uses: jlumbroso/free-disk-space@v1.3.1
              with:
                  dotnet: false

            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x
                      11.0.x

            - name: Run tests
              run: dotnet test

            - name: Run publish script
              run: ./publish-nix.sh -dp

            - name: Update rolling tag
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -f rolling
                  git push origin :refs/tags/rolling || true
                  git push origin rolling --force

            - name: Upload to rolling
              uses: ncipollo/release-action@v1.20.0
              with:
                  allowUpdates: True
                  artifacts: "*.nupkg,*.snupkg,*.zip"
                  body: "Last built commit: ${{ github.sha }}

                      ## Release UI Builds

                      These builds are identical to what would be included in a stable release. No debug symbols are included.

                      [Windows x64](https://github.com/SabreTools/MPF/releases/download/rolling/MPF.UI_net11.0-windows_win-x64_release.zip)

                      [Linux x64 (EXPERIMENTAL)](https://github.com/SabreTools/MPF/releases/download/rolling/MPF.Avalonia_net11.0_linux-x64_release.zip)

                      [MacOS ARM64 (EXPERIMENTAL)](https://github.com/SabreTools/MPF/releases/download/rolling/MPF.Avalonia_net11.0_osx-arm64_release.zip)

                      ## Debug UI Builds

                      These builds include debug symbols and are useful for tracing issues. This build is not needed if no debugging will be done.

                      [Windows x64](https://github.com/SabreTools/MPF/releases/download/rolling/MPF.UI_net11.0-windows_win-x64_debug.zip)

                      [Linux x64 (EXPERIMENTAL)](https://github.com/SabreTools/MPF/releases/download/rolling/MPF.Avalonia_net11.0_linux-x64_debug.zip)

                      [MacOS ARM64 (EXPERIMENTAL)](https://github.com/SabreTools/MPF/releases/download/rolling/MPF.Avalonia_net11.0_osx-arm64_debug.zip)
                      
                      "
                  name: "Rolling Release"
                  prerelease: True
                  replacesArtifacts: True
                  tag: "rolling"
                  updateOnlyUnreleased: True
